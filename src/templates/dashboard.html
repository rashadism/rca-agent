<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenChoreo RCA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 300px;
            background: #f8f9fa;
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
            border-right: 1px solid #dee2e6;
        }

        .sidebar h1 {
            color: #2c3e50;
            font-size: 18px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #0480fd;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar h1 img {
            height: 24px;
            width: auto;
        }

        .sidebar label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 13px;
        }

        .sidebar textarea {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            border: 1px solid #0480fd;
            border-radius: 6px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            background: #ffffff;
            color: #2c3e50;
        }

        .sidebar textarea::placeholder {
            color: #7f8c8d;
        }

        .sidebar button {
            width: 100%;
            background: #0480fd;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s;
        }

        .sidebar button:hover {
            background: #0369d6;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(4, 128, 253, 0.3);
        }

        .sidebar button:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 15px 0;
            color: #0480fd;
            background: #ffffff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #0480fd;
            font-size: 13px;
        }

        .error {
            background: #e74c3c;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin: 15px 0;
            display: none;
            font-size: 13px;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: white;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #95a5a6;
            font-size: 18px;
        }

        .report-container {
            max-width: 1000px;
            margin: 0 auto;
            display: none;
        }

        .report-header {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ecf0f1;
        }

        .section-header {
            background: #002a69;
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
            margin: 25px 0 15px 0;
            font-size: 16px;
            font-weight: 600;
        }

        .summary {
            background: #ecf0f1;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 25px;
            border-left: 4px solid #0480fd;
            font-size: 15px;
        }

        .timeline {
            margin-bottom: 30px;
        }

        .timeline-event {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 4px;
            border-left: 3px solid #0480fd;
            position: relative;
        }

        .timestamp {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .severity {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 10px;
        }

        .severity-info { background: #d4edda; color: #155724; }
        .severity-warning { background: #fff3cd; color: #856404; }
        .severity-error { background: #f8d7da; color: #721c24; }
        .severity-critical { background: #d1003f; color: white; }

        .root-cause {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .root-cause-title {
            font-weight: 600;
            color: #e74c3c;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .evidence-list {
            margin-top: 12px;
            padding-left: 20px;
        }

        .evidence-item {
            list-style-type: disc;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
        }

        .remediation-step {
            background: #e8f5e9;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 4px;
            border-left: 3px solid #4caf50;
        }

        .step-number {
            font-weight: 600;
            color: #2e7d32;
            margin-right: 8px;
        }

        .raw-response {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #dee2e6;
        }

        .raw-response pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .toggle-raw {
            background: #6c757d;
            padding: 8px 15px;
            font-size: 13px;
            margin-bottom: 10px;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .toggle-raw:hover {
            background: #5a6268;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .sidebar {
                width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h1>
                <img src="https://openchoreo.dev/img/openchoreo-logo.svg" alt="OpenChoreo Logo">
                OpenChoreo RCA
            </h1>

            <label for="jsonData">Trigger payload</label>
            <textarea id="jsonData" placeholder='Enter a payload to trigger RCA, e.g.:
{
  organization: default
  project: project-name
  component: component-name
  environment: production
  alert: alert-name
  start time: 2025-11-20T07:39:04Z
  end time: 2025-11-20T07:59:04Z
}'></textarea>
            
            <button onclick="analyzeContent()">Analyze</button>
            
            <div class="loading">
                ⏳ Analyzing content...
            </div>
            
            <div class="error" id="error"></div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="empty-state" id="empty-state">
                Enter JSON data in the sidebar and click Analyze to generate a report
            </div>
            
            <div class="report-container" id="report">
                <!-- Report will be populated here -->
            </div>
        </div>
    </div>

    <script>
        async function analyzeContent() {
            const jsonDataInput = document.getElementById('jsonData').value.trim();
            if (!jsonDataInput) {
                showError('Please enter JSON data to analyze');
                return;
            }

            let jsonData;
            try {
                jsonData = JSON.parse(jsonDataInput);
            } catch (e) {
                showError('Invalid JSON format. Please enter valid JSON data.');
                return;
            }

            const button = document.querySelector('button');
            const loading = document.querySelector('.loading');
            const errorDiv = document.getElementById('error');
            const emptyState = document.getElementById('empty-state');
            const reportDiv = document.getElementById('report');

            // Reset UI
            button.disabled = true;
            loading.style.display = 'block';
            errorDiv.style.display = 'none';
            emptyState.style.display = 'none';
            reportDiv.style.display = 'none';

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        data: jsonData
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const responseData = await response.json();
                
                // Extract the nested result
                const data = responseData.result;
                
                if (!data) {
                    throw new Error('Invalid response format');
                }
                
                displayResponse(data);
            } catch (error) {
                showError(`Failed to analyze: ${error.message}`);
                emptyState.style.display = 'flex';
            } finally {
                button.disabled = false;
                loading.style.display = 'none';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function displayResponse(data) {
            const reportDiv = document.getElementById('report');
            let html = '<h2 class="report-header">Root Cause Analysis Report</h2>';

            // Summary
            if (data.summary) {
                html += `
                    <div class="section-header">📋 Summary</div>
                    <div class="summary">${escapeHtml(data.summary)}</div>
                `;
            }

            // Timeline
            if (data.timeline && data.timeline.length > 0) {
                html += `<div class="section-header">⏱️ Timeline of Events</div>`;
                html += '<div class="timeline">';
                data.timeline.forEach(event => {
                    const severityClass = event.severity ? `severity-${event.severity}` : '';
                    html += `
                        <div class="timeline-event">
                            <div class="timestamp">
                                ${formatTimestamp(event.timestamp)}
                                ${event.severity ? `<span class="severity ${severityClass}">${event.severity.toUpperCase()}</span>` : ''}
                            </div>
                            <div>${escapeHtml(event.description)}</div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            // Root Causes
            if (data.root_causes && data.root_causes.length > 0) {
                html += `<div class="section-header">🔴 Root Causes</div>`;
                data.root_causes.forEach((cause, index) => {
                    html += `
                        <div class="root-cause">
                            <div class="root-cause-title">Root Cause ${index + 1}</div>
                            <div>${escapeHtml(cause.description)}</div>
                    `;
                    
                    if (cause.supporting_evidence && cause.supporting_evidence.length > 0) {
                        html += '<div style="margin-top: 12px; font-weight: 600; font-size: 14px;">Supporting Evidence:</div>';
                        html += '<ul class="evidence-list">';
                        cause.supporting_evidence.forEach(evidence => {
                            html += `<li class="evidence-item">${escapeHtml(evidence.description)}</li>`;
                        });
                        html += '</ul>';
                    }
                    html += '</div>';
                });
            }

            // Remediation Steps
            if (data.remediation_steps && data.remediation_steps.length > 0) {
                html += `<div class="section-header">✅ Remediation Steps</div>`;
                data.remediation_steps.forEach((step, index) => {
                    html += `
                        <div class="remediation-step">
                            <span class="step-number">Step ${index + 1}:</span>
                            ${escapeHtml(step.action)}
                        </div>
                    `;
                });
            }

            // Raw Response
            html += `
                <div class="raw-response">
                    <button class="toggle-raw" onclick="toggleRaw()">Toggle Raw JSON Response</button>
                    <pre id="raw-json" style="display: none;">${escapeHtml(JSON.stringify(data, null, 2))}</pre>
                </div>
            `;

            reportDiv.innerHTML = html;
            reportDiv.style.display = 'block';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTimestamp(timestamp) {
            try {
                const date = new Date(timestamp);
                return date.toLocaleString();
            } catch {
                return timestamp;
            }
        }

        function toggleRaw() {
            const rawJson = document.getElementById('raw-json');
            rawJson.style.display = rawJson.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
